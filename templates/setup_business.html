{% extends "base.html" %}
{% block title %}Settings — {{ app_name }}{% endblock %}
{% block page_title %}Settings{% endblock %}

{% block content %}
<nav class="breadcrumb-nav">
  <i class="bi bi-gear-fill" style="color: var(--ink-3); margin-right: 8px;"></i>
  <span>Settings</span>
  <i class="bi bi-chevron-right"></i>
  <span>Business Profile</span>
</nav>

<div style="max-width: 800px; margin: 24px auto;">
  <div class="form-card">
    
    <div class="form-card-header" style="border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; gap: 16px; align-items: center;">
        <div class="form-card-icon blue"><i class="bi bi-building"></i></div>
        <div>
          <h2 class="form-card-title">Business Details</h2>
          <p class="form-card-sub">Update your company info, GST, and contact details.</p>
        </div>
      </div>
      
      <button form="profileForm" type="submit" class="btn-submit" style="padding: 8px 16px; font-size: 0.85rem;">
        <i class="bi bi-check2-circle"></i> Save Profile
      </button>
    </div>

    <form method="POST" id="profileForm" class="client-form">

      <div class="form-row two-col">
        <div class="form-group">
          <label class="form-label required">Business Name</label>
          <div class="input-wrap">
            <i class="bi bi-shop input-icon"></i>
            <input type="text" class="form-field" name="business_name" 
                   value="{{ profile.business_name if profile else '' }}" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label required">Owner Name</label>
          <div class="input-wrap">
            <i class="bi bi-person input-icon"></i>
            <input type="text" class="form-field" name="owner_name" 
                   value="{{ profile.owner_name if profile else '' }}" required>
          </div>
        </div>
      </div>

      <div class="form-row two-col">
        <div class="form-group">
          <label class="form-label">UPI ID</label>
          <div class="input-wrap">
            <i class="bi bi-wallet2 input-icon"></i>
            <input type="text" class="form-field" name="upi_id" 
                   value="{{ profile.upi_id if profile else '' }}" placeholder="e.g. name@bank">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">GST Number</label>
          <div class="input-wrap">
            <i class="bi bi-file-earmark-text input-icon"></i>
            <input type="text" class="form-field" name="gst_number" 
                   value="{{ profile.gst_number if profile else '' }}" placeholder="29ABCDE1234F1Z5">
          </div>
        </div>
      </div>

      <div class="form-row two-col">
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <div class="input-wrap">
            <i class="bi bi-telephone input-icon"></i>
            <input type="text" class="form-field" name="phone" 
                   value="{{ profile.phone if profile else '' }}">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrap">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" class="form-field" name="email" 
                   value="{{ profile.email if profile else '' }}">
          </div>
        </div>
      </div>

    </form>

  </div>
</div>
{% endblock %}
